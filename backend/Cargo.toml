[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
# Веб-фреймворк (очень быстрый)
axum = "0.7"
# Асинхронный рантайм
tokio = { version = "1", features = ["full"] }
# Работа с базой данных (с проверкой запросов при компиляции!)
sqlx = { version = "0.7", features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "time",
] }
# Сериализация JSON (чтобы общаться с React)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Работа с .env файлами
dotenvy = "0.15"
# Работа с датой и временем
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
# Настройка CORS (чтобы React с порта 3000 мог стучаться на 8080)
tower-http = { version = "0.5", features = ["cors"] }
